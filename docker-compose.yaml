version: '3.8'

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --advertise-kafka-addr redpanda:9092
    ports:
      - "9092:9092" # Kafka API
      - "9644:9644" # Admin API
    volumes:
      - ./infra/redpanda/data:/var/lib/redpanda/data
      - ./infra/redpanda/logs:/var/lib/redpanda/log

  console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8080:8080" # Web UI
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - REDPANDA_ADMIN_URL=http://redpanda:9644
    depends_on:
      - redpanda

  connect:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: redpanda-connect
    volumes:
      - ./infra/connect/config/config.yaml:/config.yaml
      - ./infra/connect/data/md-files:/data/md-files
    env_file: .env
    command: ["run", "/config.yaml"]
    depends_on:
      - redpanda

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - ./infra/qdrant/storage:/qdrant/storage
