services:
  extractor:
    build:
      context: ./src/extractor/Extractor
      dockerfile: Extractor/Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8080:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - EXTRACTOR_URL=http://extractor:8080
      - UPLOADS_DB_PATH=/data/uploads.db
    volumes:
      - backend_data:/data
    depends_on:
      - extractor
    ports:
      - "8001:8001"
    # backend отдаёт и API (/api/*), и статику дашборда (всё остальное) с одного
    # порта - так относительный fetch('/api/upload') на фронте всегда попадает
    # в тот же origin, откуда была загружена страница. Открывать: http://localhost:8001/

volumes:
  backend_data:
